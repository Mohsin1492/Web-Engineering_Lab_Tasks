
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Navigation</title>
    <style>
        .menu-bar{background:linear-gradient(to right,#ff512f,#dd2476);color:white;padding:12px;box-shadow:4px 4px 8px gray;}
        .menu-list{list-style:none;display:flex;gap:25px;margin:0;padding:0;}
        .menu-list li{position:relative;}
        .menu-list a{text-decoration:none;color:white;font-size:17px;}
        .dropdown-menu{display:none;position:absolute;top:100%;left:0;background-color:#4a4a4a;padding:10px;min-width:140px;z-index:1;}
        .dropdown-menu li{margin:10px 0;}
        .dropdown:hover .dropdown-menu{display:block;}
    </style>
</head>
<body>
    <nav class="menu-bar">
        <ul class="menu-list">
            <li><a href="#">Home</a></li>
            <li class="dropdown">
                <a href="#">Menu ▼</a>
                <ul class="dropdown-menu">
                    <li><a href="#">Starters</a></li>
                    <li><a href="#">Main Course</a></li>
                    <li><a href="#">Desserts</a></li>
                </ul>
            </li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
