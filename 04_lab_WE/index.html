
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>
        .profile-box{width:320px;height:180px;border:3px solid green;padding:25px;margin:35px;}
        /* Total width = 320 + 50 + 6 = 376px */
        .profile-box p{background-color:#fff9c4;font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="profile-box">
        <p>
            Hello! My name is Mohsin. I am a Software
            Engineering student at SMIU Karachi. I am
            interested in web development and programming.
        </p>
    </div>
</body>
</html>
