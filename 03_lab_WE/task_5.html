
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Margin and Padding</title>
    <style>
        .box1{border:3px solid blue;margin:30px;padding:20px;background-color:lightblue;}
        .box2{border:3px solid green;margin:10px 50px;padding:10px 30px;background-color:lightyellow;}
    </style>
</head>
<body>
    <h1>Margin and Padding Example</h1>
    <div class="box1">
        <h2>First Box</h2>
        <p>
            This box has a margin of 30px and padding of 20px.
        </p>
    </div>
    <div class="box2">
        <h2>Second Box</h2>
        <p>
            This box has different margin and padding values.
        </p>
    </div>
</body>
</html>
