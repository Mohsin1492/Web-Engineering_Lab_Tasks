<!DOCTYPE html>
<html>
<head>
    <title>Container Fluid Layout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid mt-4">

    <h2 class="text-center">Responsive Layout</h2>

    <!-- First Row: Two Different Width Columns -->
    <div class="row">
        <div class="col-8 bg-primary text-white p-4">
            <h3>First Column</h3>
            <p>This column takes 8 parts of the grid.</p>
        </div>

        <div class="col-4 bg-success text-white p-4">
            <h3>Second Column</h3>
            <p>This column takes 4 parts of the grid.</p>
        </div>
    </div>

    <!-- Second Row: Full Width Column -->
    <div class="row mt-3">
        <div class="col-12 bg-warning p-4">
            <h3>Full Width Column</h3>
            <p>This column takes the complete width.</p>
        </div>
    </div>

    <!-- Third Row: Three Image Columns -->
    <div class="row mt-3">

        <div class="col-md-4">
            <img src="https://picsum.photos/400/250?random=1"
                 class="img-fluid" alt="Image 1">
        </div>

        <div class="col-md-4">
            <img src="https://picsum.photos/400/250?random=2"
                 class="img-fluid" alt="Image 2">
        </div>

        <div class="col-md-4">
            <img src="https://picsum.photos/400/250?random=3"
                 class="img-fluid" alt="Image 3">
        </div>

    </div>

</div>

</body>
</html>
