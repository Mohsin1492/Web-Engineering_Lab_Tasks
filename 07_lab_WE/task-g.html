<!DOCTYPE html>
<html>
<head>
    <title>Product Grid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Our Products</h2>

    <div class="row">

        <!-- Product 1 -->
        <div class="col-md-4 mb-3">
            <div class="card">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT5MbfECVp752UCZzVSXW-7LlA-ileUGgnEAKelVyPRSA&s"
                     class="card-img-top" alt="Mobile Phone">

                <div class="card-body">
                    <h5 class="card-title">Mobile Phone</h5>

                    <p class="card-text">
                        A modern smartphone with useful features.
                    </p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-md-4 mb-3">
            <div class="card">

                <img src="https://static.webx.pk/files/87161/Images/czone-20260604090402-87161-0-040626090420424.webp"
                     class="card-img-top" alt="Laptop">

                <div class="card-body">
                    <h5 class="card-title">Laptop</h5>

                    <p class="card-text">
                        A powerful laptop for work and study.
                    </p>

                    <button class="btn btn-success">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-md-4 mb-3">
            <div class="card">

                <img src="https://m1.com.pk/wp-content/uploads/2023/02/1-1.jpg"
                     class="card-img-top" alt="Headphones">

                <div class="card-body">
                    <h5 class="card-title">Headphones</h5>

                    <p class="card-text">
                        Comfortable headphones with clear sound.
                    </p>

                    <button class="btn btn-warning">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>
