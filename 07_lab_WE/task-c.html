<!DOCTYPE html>
<html>
<head>
    <title>Nested Grid Layout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 class="text-center">Nested Grid Layout</h2>

    <div class="row">

        <div class="col-md-6 bg-primary text-white p-4">
            <h3>First Column</h3>
            <p>This is the first main column.</p>
        </div>

        <div class="col-md-6 bg-light p-4">

            <h3>Second Column</h3>

            <!-- Nested Row -->
            <div class="row">

                <div class="col-6 bg-success text-white p-3">
                    <h4>Nested Column 1</h4>
                    <p>First nested content.</p>
                </div>

                <div class="col-6 bg-warning p-3">
                    <h4>Nested Column 2</h4>
                    <p>Second nested content.</p>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
