<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Card</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Tourist Place Card</h2>

    <div class="card" style="width: 18rem;">

        <img src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/0d/d5/1c/94/passu-valley-hunza-valley.jpg?w=800&h=-1&s=1"
             class="card-img-top" alt="Tourist Place">

        <div class="card-body">

            <h5 class="card-title">Hunza Valley</h5>

            <p class="card-text">
                Hunza Valley is a beautiful tourist destination
                famous for its mountains and natural scenery.
            </p>

            <a href="#" class="btn btn-primary">
                Read More
            </a>

        </div>

    </div>

</div>

</body>
</html>
