<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Grid Layout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 class="text-center">Two Rows and Two Columns</h2>

    <div class="row">
        <div class="col bg-primary text-white p-4">
            <h3>Column 1</h3>
            <p>This is first column of row one.</p>
        </div>

        <div class="col bg-success text-white p-4">
            <h3>Column 2</h3>
            <p>This is second column of row one.</p>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col bg-warning p-4">
            <h3>Column 3</h3>
            <p>This is first column of row two.</p>
        </div>

        <div class="col bg-danger text-white p-4">
            <h3>Column 4</h3>
            <p>This is second column of row two.</p>
        </div>
    </div>

</div>

</body>
</html>
